services:
  bot:
    build: .
    env_file: .env
    volumes:
      # `:U` chowns the bind-mount source to the container user (UID 1000
      # inside, mapped to a subuid on the host under rootless). `:Z`
      # applies a private SELinux label so the bot can access the mount
      # on enforcing distros (Fedora / RHEL / Rocky). Docker ignores both
      # flags; on Debian/Ubuntu the `:Z` is a no-op.
      - ./data:/app/data:U,Z
    restart: unless-stopped
    # Reach the preview sidecar by service name on the default compose
    # network. The bot tolerates the service being unreachable (falls
    # back to no custom embed), so this isn't a hard dependency.
    environment:
      - PREVIEW_SERVICE_URL=http://preview:3000
    depends_on:
      - preview

  preview:
    build: ./preview
    restart: unless-stopped
    # No `ports:` — the bot is the only client; keep it on the internal
    # compose network rather than exposing Chromium to the host.
