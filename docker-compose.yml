services:
  bot:
    build: .
    env_file: .env
    volumes:
      # `:U` tells podman to chown the bind-mount source to the container
      # user (UID 1000 inside, mapped to a subuid on the host under
      # rootless). Without it, the bot user inside the container can't
      # read/write files that were created on the host (e.g. via
      # `podman cp` or a fresh `mkdir`). Docker ignores the flag.
      - ./data:/app/data:U
    restart: unless-stopped
    # Reach the preview sidecar by service name on the default compose
    # network. The bot tolerates the service being unreachable (falls
    # back to no custom embed), so this isn't a hard dependency.
    environment:
      - PREVIEW_SERVICE_URL=http://preview:3000
    depends_on:
      - preview

  preview:
    build: ./preview
    restart: unless-stopped
    # No `ports:` — the bot is the only client; keep it on the internal
    # compose network rather than exposing Chromium to the host.
